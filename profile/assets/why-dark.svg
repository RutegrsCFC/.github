<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 210" width="1280" height="210" role="img" aria-label="Why RCFC: China-focused, covering Chinese finance, tech and regulation, a gap at RBS today. East and West: connecting both sides. Bilingual programming in English and Chinese. Open to all Rutgers students, no finance background needed.">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; }
  .serif { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, 'Songti SC', 'Noto Serif SC', 'Source Han Serif SC', serif; }
  .cjk { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', 'Source Han Sans SC', sans-serif; }
  .cjks { font-family: 'Songti SC', 'STSong', 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', serif; }
  .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .rv { opacity: 0; animation: rv 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  @keyframes rv { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .dr { animation: dr 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  @keyframes dr { to { stroke-dashoffset: 0; } }
  
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; } .rv { opacity: 1 !important; transform: none !important; } .dr { stroke-dashoffset: 0 !important; } }
</style>

  <g class="rv" style="animation-delay:0.05s">
    <rect x="0.5" y="0.5" width="289" height="209" rx="18" fill="#222837" stroke="rgba(246,243,238,0.08)"/>
    <text x="28" y="46" class="cjks" font-size="14" letter-spacing="3" fill="#ff6b63">聚焦中国</text>
    <text x="28" y="100" class="serif" font-size="31" letter-spacing="-0.4" fill="#f6f3ee">China-focused</text>
    <path d="M28 126 H56" stroke="#ff6b63" stroke-width="1.5"/>
    <text y="160" class="sans" font-size="15.5" fill="#c4c7d4"><tspan x="28" dy="0">Chinese finance, tech and</tspan><tspan x="28" dy="22">regulation, a gap at RBS today</tspan></text>
  </g>
  <g class="rv" style="animation-delay:0.15s">
    <rect x="330.5" y="0.5" width="289" height="209" rx="18" fill="#222837" stroke="rgba(246,243,238,0.08)"/>
    <text x="358" y="46" class="cjks" font-size="14" letter-spacing="3" fill="#ff6b63">连接东西方</text>
    <text x="358" y="100" class="serif" font-size="31" letter-spacing="-0.4" fill="#f6f3ee">East ↔ West</text>
    <path d="M358 126 H386" stroke="#ff6b63" stroke-width="1.5"/>
    <text y="160" class="sans" font-size="15.5" fill="#c4c7d4"><tspan x="358" dy="0">Connecting both sides,</tspan><tspan x="358" dy="22">not one market</tspan></text>
  </g>
  <g class="rv" style="animation-delay:0.25s">
    <rect x="660.5" y="0.5" width="289" height="209" rx="18" fill="#222837" stroke="rgba(246,243,238,0.08)"/>
    <text x="688" y="46" class="cjks" font-size="14" letter-spacing="3" fill="#ff6b63">中英双语</text>
    <text x="688" y="100" class="serif" font-size="31" letter-spacing="-0.4" fill="#f6f3ee">English · 中文</text>
    <path d="M688 126 H716" stroke="#ff6b63" stroke-width="1.5"/>
    <text y="160" class="sans" font-size="15.5" fill="#c4c7d4"><tspan x="688" dy="0">Programming in</tspan><tspan x="688" dy="22">both languages</tspan></text>
  </g>
  <g class="rv" style="animation-delay:0.35s">
    <rect x="990.5" y="0.5" width="289" height="209" rx="18" fill="#222837" stroke="rgba(246,243,238,0.08)"/>
    <text x="1018" y="46" class="cjks" font-size="14" letter-spacing="3" fill="#ff6b63">面向全体</text>
    <text x="1018" y="100" class="serif" font-size="31" letter-spacing="-0.4" fill="#f6f3ee">Open to all</text>
    <path d="M1018 126 H1046" stroke="#ff6b63" stroke-width="1.5"/>
    <text y="160" class="sans" font-size="15.5" fill="#c4c7d4"><tspan x="1018" dy="0">Any Rutgers student,</tspan><tspan x="1018" dy="22">no finance background needed</tspan></text>
  </g>
</svg>

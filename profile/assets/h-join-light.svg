<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 150" width="1280" height="150" role="img" aria-label="Become a Member · 成为会员">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; }
  .cjk { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', 'Source Han Sans SC', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  
  .grow { transform-origin: 640px 0; animation: grow 1.6s cubic-bezier(0.22,1,0.28,1) forwards; transform: scaleX(0.2); }
  @keyframes grow { to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { .grow { transform: none; } }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs><linearGradient id="h" x1="0" x2="1">
  <stop offset="0" stop-color="rgba(13,17,23,0.18)" stop-opacity="0"/><stop offset="0.5" stop-color="rgba(13,17,23,0.18)"/>
  <stop offset="1" stop-color="rgba(13,17,23,0.18)" stop-opacity="0"/></linearGradient></defs>
<g class="grow"><rect x="140" y="28" width="1000" height="1" fill="url(#h)"/></g>
<rect x="633" y="21" width="14" height="14" transform="rotate(45 640 28)" fill="#ffffff" stroke="#cc0033" stroke-width="1.5"/>
<rect x="637" y="25" width="6" height="6" transform="rotate(45 640 28)" fill="#cc0033"/>
<text x="640" y="72" text-anchor="middle" class="mono" font-size="15" letter-spacing="4" fill="#c8002f">03 · JOIN US</text>
<text x="640" y="118" text-anchor="middle" class="sans" font-size="42" font-weight="700" letter-spacing="-1" fill="#0b0b10">Become a Member <tspan class="cjk" font-size="30" font-weight="500" letter-spacing="2" fill="#6a6a76">成为会员</tspan></text>
</svg>

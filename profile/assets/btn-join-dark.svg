<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 60" width="340" height="60" role="img" aria-label="Become a Member">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; }
  .cjk { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', 'Source Han Sans SC', sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  
  .shine { animation: shine 4.5s ease-in-out infinite; }
  @keyframes shine { 0%, 60% { transform: translateX(0); } 100% { transform: translateX(520px); } }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e30a3d"/><stop offset="1" stop-color="#b3002d"/></linearGradient>
  <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="pill"><rect width="340" height="60" rx="30"/></clipPath>
</defs>
<g clip-path="url(#pill)"><rect x="0" y="0" width="340" height="60" rx="30" fill="url(#bg)"/><rect x="-120" y="0" width="80" height="60" fill="url(#shine)" class="shine"/></g><rect x="0.5" y="0.5" width="339" height="59" rx="29.5" fill="none" stroke="rgba(255,255,255,0.22)"/>
<g transform="translate(26 19)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="10"/><path d="M11 6v10M6 11h10"/></g>
<text x="60" y="37" class="sans" font-size="19" font-weight="600" letter-spacing="-0.2" fill="#ffffff">Become a Member <tspan class="cjk" font-size="15" font-weight="400" fill="rgba(255,255,255,0.78)">成为会员</tspan></text>
<text x="310" y="37" text-anchor="end" class="sans" font-size="19" fill="#ffffff">→</text>
</svg>

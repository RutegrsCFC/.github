<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 60" width="330" height="60" role="img" aria-label="Become a Member">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; }
  .serif { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, 'Songti SC', 'Noto Serif SC', 'Source Han Serif SC', serif; }
  .cjk { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', 'Source Han Sans SC', sans-serif; }
  .cjks { font-family: 'Songti SC', 'STSong', 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', serif; }
  .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
  .rv { opacity: 0; animation: rv 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  @keyframes rv { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  .dr { animation: dr 2.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  @keyframes dr { to { stroke-dashoffset: 0; } }
  
  .shine { animation: shine 5s cubic-bezier(0.65,0,0.35,1) 1s infinite; }
  @keyframes shine { 0% { transform: translateX(0); } 45%, 100% { transform: translateX(560px); } }

  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; } .rv { opacity: 1 !important; transform: none !important; } .dr { stroke-dashoffset: 0 !important; } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6a5f"/><stop offset="1" stop-color="#e2453f"/></linearGradient>
  <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="pill"><rect width="330" height="60" rx="30"/></clipPath>
</defs>
<g clip-path="url(#pill)"><rect width="330" height="60" rx="30" fill="url(#bg)"/><rect x="-140" width="90" height="60" fill="url(#shine)" class="shine"/></g><rect x="0.5" y="0.5" width="329" height="59" rx="29.5" fill="none" stroke="rgba(255,255,255,0.25)"/>
<g transform="translate(26 19)" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="10"/><path d="M11 6.5v9M6.5 11h9"/></g>
<text x="60" y="37" class="sans" font-size="18" font-weight="600" fill="#ffffff">Become a Member <tspan class="cjk" font-size="14" font-weight="400" fill="rgba(255,255,255,0.75)">成为会员</tspan></text>
<text x="300" y="37" text-anchor="end" class="sans" font-size="18" fill="#ffffff">→</text>
</svg>

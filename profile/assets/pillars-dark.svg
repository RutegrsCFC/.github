<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 390" width="846" height="390" role="img" aria-label="What we do. FinTech and AI: Chinese AI workshop, financial engineering, student AI toolkit. Networking: alumni stories, company tours, industry expert talks. Practice: equity research, certificates, exchange programs.">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; }
  .serif { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, 'Songti SC', 'Noto Serif SC', serif; }

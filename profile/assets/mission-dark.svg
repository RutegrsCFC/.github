    <text y="150" class="serif" font-size="25" fill="#f6f3ee"><tspan x="44" dy="0">Bridge Western finance with Chinese</tspan><tspan x="44" dy="38">market dynamics, giving Rutgers Business</tspan><tspan x="44" dy="38">School students practical insight into</tspan><tspan x="44" dy="38">China’s financial systems and tech sector</tspan><tspan x="44" dy="38">to power their global careers.</tspan></text>
    <text y="358" class="cjk" font-size="16" fill="#8b91a7"><tspan x="44" dy="0">将西方金融与中国市场的动态相结合，为罗格斯商学院的学生提供关于中</tspan><tspan x="44" dy="28">国金融体系和科技行业的实践性见解，助力他们在全球职业生涯中取得成</tspan><tspan x="44" dy="28">功。</tspan></text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 490" width="846" height="490" role="img" aria-label="Mission: Bridge Western finance with Chinese market dynamics, giving Rutgers Business School students practical insight into China’s financial systems and tech sector to power their global careers. Vision: Preparing Rutgers students for global finance through cross-border education, insight and skills practice.">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; }
  .serif { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, 'Songti SC', 'Noto Serif SC', serif; }
  .cjk { font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; }
  .cjks { font-family: 'Songti SC', 'STSong', 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', serif; }
  .rv { opacity: 0; animation: rv 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  @keyframes rv { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .dr { animation: dr 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  @keyframes dr { to { stroke-dashoffset: 0; } }
  .grow { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  @keyframes grow { to { transform: scaleX(1); } }
  
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
    .rv, .fi { opacity: 1; } .grow { transform: none; } .dr { stroke-dashoffset: 0; }
  }
</style>
<defs><clipPath id="f"><rect width="846" height="490" rx="20"/></clipPath></defs>
<g clip-path="url(#f)">
  <rect width="846" height="490" fill="#1f252e"/>
  
  
  <g class="rv" style="animation-delay:0.15s">
    <circle cx="59" cy="64" r="3" fill="#ff6b63"/>
    <text x="72" y="70" class="serif" font-size="20" fill="#f6f3ee">Mission</text>
    <text x="72" y="96" class="cjks" font-size="14" letter-spacing="4" fill="#8a90a2">使命</text>
    <text y="70" class="serif" font-size="22" fill="#f6f3ee"><tspan x="236" dy="0">Bridge Western finance with Chinese market dynamics,</tspan><tspan x="236" dy="34">giving Rutgers Business School students practical</tspan><tspan x="236" dy="34">insight into China’s financial systems and tech</tspan><tspan x="236" dy="34">sector to power their global careers.</tspan></text>
    <text y="212" class="cjk" font-size="14.5" fill="#b4b8c2"><tspan x="236" dy="0">将西方金融与中国市场的动态相结合，为罗格斯商学院的学生提供关于中国金</tspan><tspan x="236" dy="25">融体系和科技行业的实践性见解，助力他们在全球职业生涯中取得成功。</tspan></text>
  </g>
  <rect x="56" y="281" width="734" height="1" fill="rgba(246,243,238,0.12)" class="grow" style="animation-delay:0.25s"/>
  <g class="rv" style="animation-delay:0.35s">
    <circle cx="59" cy="333" r="3" fill="#ff6b63"/>
    <text x="72" y="339" class="serif" font-size="20" fill="#f6f3ee">Vision</text>
    <text x="72" y="365" class="cjks" font-size="14" letter-spacing="4" fill="#8a90a2">愿景</text>
    <text y="339" class="serif" font-size="22" fill="#f6f3ee"><tspan x="236" dy="0">Preparing Rutgers students for global finance through</tspan><tspan x="236" dy="34">cross-border education, insight and skills practice.</tspan></text>
    <text y="413" class="cjk" font-size="14.5" fill="#b4b8c2"><tspan x="236" dy="0">通过跨境教育、专业洞见和技能实践，帮助罗格斯</tspan><tspan x="236" dy="25">大学的学生为投身全球金融领域做好准备。</tspan></text>
  </g>
  <rect x="0.5" y="0.5" width="845" height="489" rx="19.5" fill="none" stroke="rgba(246,243,238,0.08)"/>
</g>
</svg>
